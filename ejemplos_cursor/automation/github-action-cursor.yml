# .github/workflows/cursor-review.yml
# Revisión automática de PR con Cursor SDK (sustituye el ejemplo claude -p).
#
# Copia este fichero a .github/workflows/ y asegura que review.ts esté en el path
# referenciado abajo (o ajústalo). Secret: CURSOR_API_KEY.
name: Cursor Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Cursor SDK
        run: npm install @cursor/sdk tsx

      - name: Collect changed files
        id: diff
        run: |
          {
            echo 'files<<EOF'
            git diff --name-only "origin/${{ github.base_ref }}...HEAD"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Cursor review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          FILES: ${{ steps.diff.outputs.files }}
        run: npx tsx ejemplos_cursor/automation/review.ts
